<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Telegram Mini App Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f6f6;
        text-align: center;
        padding: 40px;
        color: #333;
      }
      h2 {
        color: #0088cc;
      }
      button {
        padding: 12px 25px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #0088cc;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #0070aa;
      }
    </style>
  </head>

  <body>
    <h2>Привет, <span id="name">гость</span> 👋</h2>
    <p>Это пример Telegram Mini App</p>
    <button onclick="sendToBot()">Отправить данные боту</button>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      // Показываем имя пользователя (если Telegram передал его)
      document.getElementById('name').innerText =
        tg.initDataUnsafe?.user?.first_name || 'гость';

      // Отправляем данные обратно в бот
      function sendToBot() {
        tg.sendData(JSON.stringify({ action: "clicked" }));
      }
    </script>
  </body>
</html>
